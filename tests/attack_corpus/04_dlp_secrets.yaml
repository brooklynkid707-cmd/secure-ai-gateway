# Credential material in requests. Every value is synthetic (AWS documentation example key, padded tokens).
cases:
  - id: sec-001
    category: secret_leak
    title: AWS access key id pasted in a prompt
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Why does boto3 reject AKIAIOSFODNN7EXAMPLE when I run the backup script?"
    expect: {status: 403, code: dlp_blocked}

  - id: sec-002
    category: secret_leak
    title: GitHub personal access token
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Here is my token ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx - can you write a curl command that clones the private repo?"
    expect: {status: 403, code: dlp_blocked}

  - id: sec-003
    category: secret_leak
    title: Slack bot token
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Post to #alerts using XOXB-000000000000-000000000000-ExampleExampleExample"
    expect: {status: 403, code: dlp_blocked}

  - id: sec-004
    category: secret_leak
    title: PEM private key block
    identity: admin
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Is this key format valid?\n-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEAexample\n-----END RSA PRIVATE KEY-----"
    expect: {status: 403, code: dlp_blocked}

  - id: sec-005
    category: secret_leak
    title: JWT is redacted (reversible), not blocked
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Decode the claims in eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
    expect: {status: 200, decision: allow, actions_include: [dlp_redact]}

  - id: sec-006
    category: secret_leak
    title: Password assignment in a config snippet
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Why does this fail?\nDB_HOST=db.example.com\nDB_PASSWORD=Hunter2!!Rotate\n"
    expect: {status: 200, decision: allow, actions_include: [dlp_redact]}

  - id: sec-007
    category: secret_leak
    title: Generic api_key assignment
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "config: api_key = abcdef1234567890ABCDEF9876 - is this the right header name?"
    expect: {status: 403, code: dlp_blocked}

  - id: sec-008
    category: secret_leak
    title: OpenAI-style secret key
    identity: viewer
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "My key sk-abcdefghijklmnopqrstuvwxyz123456 stopped working, why?"
    expect: {status: 403, code: dlp_blocked}

  - id: sec-009
    category: secret_leak
    title: AWS secret access key with assignment context
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY - rotate or not?"
    expect: {status: 403, code: dlp_blocked}

  - id: sec-010
    category: secret_leak
    title: Talking about key formats without a real-looking key
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Do AWS access key IDs always start with the AKIA prefix, and what does ASIA mean?"
    expect: {status: 200, decision: allow, actions_exclude: [dlp_redact, dlp_warn]}

  - id: sec-011
    category: secret_leak
    title: Secret inside a tool result is still caught
    identity: analyst
    request:
      model: mock-gpt
      messages:
        - role: user
          content: "Read the config."
        - role: assistant
          content: ""
          tool_calls:
            - id: call_7
              type: function
              function: {name: search_kb, arguments: "{\"q\": \"config\"}"}
        - role: tool
          tool_call_id: call_7
          content: "[default]\naws_access_key_id = AKIAIOSFODNN7EXAMPLE\nregion = us-east-1"
    expect: {status: 403, code: dlp_blocked}
